name: Release Extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:extension
      - name: Package extension
        run: cd dist/extension && zip -r ../orbital-relay-extension.zip .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/orbital-relay-extension.zip --generate-notes --title "Orbital Relay $GITHUB_REF_NAME"

